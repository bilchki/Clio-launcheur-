name: Construire l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler
        run: gradle assembleRelease --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk ClioLauncher.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Version 0.1.${{ github.run_number }}
          files: ClioLauncher.apk
          make_latest: true
